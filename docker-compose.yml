services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adpress
      POSTGRES_PASSWORD: adpress
      POSTGRES_DB: adpress
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adpress"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://adpress:adpress@db:5432/adpress
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
